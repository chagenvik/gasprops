<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img"
     aria-label="V-cone meter diagram after ISO 5167-5, showing the pipe inner diameter D, the cone diameter dc at the beta edge on the downstream face, the support strut carrying the low pressure tapping, and the differential pressure taps p1 and p2.">
  <defs>
    <marker id="dimEnd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 z" fill="#0f8bd5"/>
    </marker>
    <marker id="dimStart" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="0.5" refY="4.5" orient="auto">
      <path d="M10,0 L0,4.5 L10,9 z" fill="#0f8bd5"/>
    </marker>
    <marker id="flowEnd" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#0f8bd5"/>
    </marker>
  </defs>

  <style>
    .lbl   { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #083a5f; }
    .tap   { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #19567d; }
    .edge  { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #0f8bd5; }
    .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #083a5f; }
    .note  { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #194f73; }
    .form  { font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f8bd5; }
    .dim   { stroke: #0f8bd5; stroke-width: 1.6; fill: none; }
    .ext   { stroke: #0f8bd5; stroke-width: 0.9; stroke-dasharray: 4 3; fill: none; }
    .lead  { stroke: #0f8bd5; stroke-width: 1.1; fill: none; }
    .tapln { stroke: #19567d; stroke-width: 2; fill: none; }
    .wall  { fill: #4a6b80; stroke: #33505f; stroke-width: 1; }
    .cone  { fill: #7f9cae; stroke: #33505f; stroke-width: 1.4; stroke-linejoin: round; }
    .bore  { stroke: #eaf6ff; stroke-width: 3.5; fill: none; stroke-linecap: round; }
  </style>

  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <text class="title" x="360" y="24" text-anchor="middle">V-cone meter — ISO 5167-5</text>

  <!-- Gas volume, bounded exactly by the inner wall surfaces at y=135 and y=245 -->
  <rect x="60" y="135" width="600" height="110" fill="#dff1ff"/>

  <!-- Body pipe wall: inner surface y=135 / y=245, outer y=126 / y=254 -->
  <rect class="wall" x="60" y="126" width="600" height="9"/>
  <rect class="wall" x="60" y="245" width="600" height="9"/>

  <!-- Support strut: anchored in the pipe wall, seated on the cone -->
  <polygon class="cone" points="404,126 430,126 430,157.7 404,166.4"/>

  <!-- Cone element: short blunt nose cone upstream, then the main cone widening to its
       maximum diameter at the flat DOWNSTREAM face, which is the beta edge (ISO 5167-5). -->
  <polygon class="cone" points="366,190 398,168 470,148 470,232 398,212"/>

  <!-- Low pressure tapping: bored through the hollow strut down to the cone -->
  <line class="bore" x1="417" y1="130" x2="417" y2="163"/>

  <!-- flow direction -->
  <line x1="14" y1="190" x2="46" y2="190" stroke="#0f8bd5" stroke-width="4" marker-end="url(#flowEnd)"/>
  <text class="tap" x="30" y="176" text-anchor="middle">Flow</text>

  <!-- Pipe inner diameter D: arrowheads land on the inner wall surfaces, not the wall centre -->
  <line class="dim" x1="150" y1="135" x2="150" y2="245" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
  <text class="lbl" x="138" y="196" text-anchor="end">D</text>

  <!-- Cone diameter dc, measured across the flat downstream face (the beta edge) -->
  <line class="ext" x1="470" y1="148" x2="516" y2="148"/>
  <line class="ext" x1="470" y1="232" x2="516" y2="232"/>
  <line class="dim" x1="508" y1="148" x2="508" y2="232" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
  <text class="lbl" x="520" y="196" text-anchor="start">d<tspan font-size="12" dy="4">c</tspan></text>

  <!-- beta edge callout, pointing at the flat downstream face -->
  <path class="lead" d="M470,166 L516,116"/>
  <circle cx="470" cy="166" r="3" fill="#0f8bd5"/>
  <text class="edge" x="520" y="112" text-anchor="start">beta edge</text>

  <!-- pressure tappings and dP transmitter; tap lines start at the inner wall surface -->
  <line class="tapln" x1="180" y1="135" x2="180" y2="70"/>
  <line class="tapln" x1="417" y1="128" x2="417" y2="70"/>
  <line class="tapln" x1="180" y1="70" x2="417" y2="70"/>
  <circle cx="298" cy="70" r="24" fill="#ffffff" stroke="#0f8bd5" stroke-width="2.5"/>
  <text class="lbl" x="298" y="76" text-anchor="middle">Δp</text>
  <text class="tap" x="172" y="112" text-anchor="end">p₁, T₁</text>
  <text class="tap" x="401" y="112" text-anchor="end">p₂</text>

  <text class="form" x="660" y="286" text-anchor="end">β = √(1 − d<tspan font-size="12" dy="4">c</tspan><tspan dy="-4">² / D²)</tspan></text>

  <text class="note" x="60" y="312">D — pipe inner diameter at the beta edge / upstream tapping [mm]</text>
  <text class="note" x="60" y="334">d꜀ — cone diameter in the plane of the beta edge, i.e. the flat downstream face [mm]</text>
  <text class="note" x="60" y="356">Δp = p₁ − p₂ — differential pressure [mbar]; p₂ is tapped through the hollow support strut</text>
  <text class="note" x="60" y="378">Expansibility from the Stewart V-cone correlation using the AGA8 isentropic exponent κ</text>
</svg>
