<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img"
     aria-label="Venturi tube diagram showing pipe diameter D, throat diameter d and the differential pressure taps p1 and p2.">
  <defs>
    <marker id="dimEnd" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0f8bd5"/>
    </marker>
    <marker id="dimStart" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 z" fill="#0f8bd5"/>
    </marker>
    <marker id="flowEnd" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#0f8bd5"/>
    </marker>
  </defs>

  <style>
    .lbl   { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #083a5f; }
    .tap   { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #19567d; }
    .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #083a5f; }
    .note  { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #194f73; }
    .form  { font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f8bd5; }
    .dim   { stroke: #0f8bd5; stroke-width: 1.6; fill: none; }
    .tapln { stroke: #19567d; stroke-width: 2; fill: none; }
    .wall  { stroke: #4a6b80; stroke-width: 9; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <text class="title" x="360" y="24" text-anchor="middle">Venturi tube — ISO 5167-4</text>

  <!-- gas volume inside the meter -->
  <polygon points="60,135 240,135 320,159 380,159 530,135 660,135 660,245 530,245 380,221 320,221 240,245 60,245"
           fill="#dff1ff"/>

  <!-- meter walls -->
  <path class="wall" d="M60,135 L240,135 L320,159 L380,159 L530,135 L660,135"/>
  <path class="wall" d="M60,245 L240,245 L320,221 L380,221 L530,245 L660,245"/>

  <!-- flow direction -->
  <line x1="14" y1="190" x2="46" y2="190" stroke="#0f8bd5" stroke-width="4" marker-end="url(#flowEnd)"/>
  <text class="tap" x="31" y="176" text-anchor="middle">Flow</text>

  <!-- pipe diameter D -->
  <line class="dim" x1="130" y1="135" x2="130" y2="245" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
  <text class="lbl" x="118" y="196" text-anchor="end">D</text>

  <!-- throat diameter d -->
  <line class="dim" x1="356" y1="159" x2="356" y2="221" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
  <text class="lbl" x="368" y="196" text-anchor="start">d</text>

  <!-- pressure tappings and dP transmitter -->
  <line class="tapln" x1="180" y1="139" x2="180" y2="70"/>
  <line class="tapln" x1="340" y1="163" x2="340" y2="70"/>
  <line class="tapln" x1="180" y1="70" x2="340" y2="70"/>
  <circle cx="260" cy="70" r="24" fill="#ffffff" stroke="#0f8bd5" stroke-width="2.5"/>
  <text class="lbl" x="260" y="76" text-anchor="middle">Δp</text>
  <text class="tap" x="172" y="118" text-anchor="end">p₁, T₁</text>
  <text class="tap" x="349" y="118" text-anchor="start">p₂</text>

  <text class="form" x="660" y="286" text-anchor="end">β = d / D</text>

  <text class="note" x="60" y="312">D — pipe inner diameter at the upstream tapping [mm]</text>
  <text class="note" x="60" y="334">d — throat diameter [mm]</text>
  <text class="note" x="60" y="356">Δp = p₁ − p₂ — differential pressure [mbar]</text>
  <text class="note" x="60" y="378">p₁, T₁ — upstream conditions → AGA8 gives density ρ₁ and isentropic exponent κ</text>
</svg>
