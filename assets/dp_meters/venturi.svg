<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img"
     aria-label="Venturi tube diagram showing the pipe inner diameter D, throat diameter d and the differential pressure taps p1 and p2.">
  <defs>
    <marker id="dimEnd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="9.5" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 z" fill="#0f8bd5"/>
    </marker>
    <marker id="dimStart" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="0.5" refY="4.5" orient="auto">
      <path d="M10,0 L0,4.5 L10,9 z" fill="#0f8bd5"/>
    </marker>
    <marker id="flowEnd" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#0f8bd5"/>
    </marker>
  </defs>

  <style>
    .lbl   { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #083a5f; }
    .tap   { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #19567d; }
    .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #083a5f; }
    .note  { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; fill: #194f73; }
    .form  { font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f8bd5; }
    .dim   { stroke: #0f8bd5; stroke-width: 1.6; fill: none; }
    .ext   { stroke: #0f8bd5; stroke-width: 0.9; stroke-dasharray: 4 3; fill: none; }
    .tapln { stroke: #19567d; stroke-width: 2; fill: none; }
    .wall  { fill: #4a6b80; stroke: #33505f; stroke-width: 1; stroke-linejoin: round; }
  </style>

  <rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
  <text class="title" x="360" y="24" text-anchor="middle">Venturi tube — ISO 5167-4</text>

  <!-- Gas volume, bounded exactly by the inner wall surfaces (y=135/245 in the run and
       y=157/223 at the throat) so the dimension arrows can terminate on them. -->
  <polygon points="60,135 240,135 320,157 390,157 540,135 660,135 660,245 540,245 390,223 320,223 240,245 60,245"
           fill="#dff1ff"/>

  <!-- Pipe wall as a filled body with distinct inner and outer edges -->
  <polygon class="wall"
           points="60,126 240,126 320,148 390,148 540,126 660,126 660,135 540,135 390,157 320,157 240,135 60,135"/>
  <polygon class="wall"
           points="60,254 240,254 320,232 390,232 540,254 660,254 660,245 540,245 390,223 320,223 240,245 60,245"/>

  <!-- flow direction -->
  <line x1="14" y1="190" x2="46" y2="190" stroke="#0f8bd5" stroke-width="4" marker-end="url(#flowEnd)"/>
  <text class="tap" x="30" y="176" text-anchor="middle">Flow</text>

  <!-- Pipe inner diameter D: arrowheads land on the inner wall surfaces, not the wall centre -->
  <line class="dim" x1="150" y1="135" x2="150" y2="245" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
  <text class="lbl" x="138" y="196" text-anchor="end">D</text>

  <!-- Throat inner diameter d -->
  <line class="ext" x1="360" y1="157" x2="394" y2="157"/>
  <line class="ext" x1="360" y1="223" x2="394" y2="223"/>
  <line class="dim" x1="388" y1="157" x2="388" y2="223" marker-start="url(#dimStart)" marker-end="url(#dimEnd)"/>
  <text class="lbl" x="400" y="196" text-anchor="start">d</text>

  <!-- pressure tappings and dP transmitter; tap lines start at the inner surface -->
  <line class="tapln" x1="180" y1="135" x2="180" y2="70"/>
  <line class="tapln" x1="340" y1="157" x2="340" y2="70"/>
  <line class="tapln" x1="180" y1="70" x2="340" y2="70"/>
  <circle cx="260" cy="70" r="24" fill="#ffffff" stroke="#0f8bd5" stroke-width="2.5"/>
  <text class="lbl" x="260" y="76" text-anchor="middle">Δp</text>
  <text class="tap" x="172" y="112" text-anchor="end">p₁, T₁</text>
  <text class="tap" x="349" y="112" text-anchor="start">p₂</text>

  <text class="form" x="660" y="286" text-anchor="end">β = d / D</text>

  <text class="note" x="60" y="312">D — pipe inner diameter at the upstream tapping [mm]</text>
  <text class="note" x="60" y="334">d — throat inner diameter [mm]</text>
  <text class="note" x="60" y="356">Δp = p₁ − p₂ — differential pressure [mbar]</text>
  <text class="note" x="60" y="378">p₁, T₁ — upstream conditions → AGA8 gives density ρ₁ and isentropic exponent κ</text>
</svg>
