apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: gasprops
spec:
  environments:
    - name: prod
      build:
        from: main

  components:
    - name: main
      src: ./

      # Streamlit session state works best with a single replica.
      replicas: 1

      resources:
        requests:
          cpu: 1000m
          memory: 2048Mi
        limits:
          cpu: 2000m
          memory: 4096Mi

      publicPort: http
      ports:
        - name: http
          port: 8501

      environmentConfig:
        - environment: prod
          runAsNonRoot: true
          enabled: true

  dnsAlias:
    - alias: gasprops
      environment: prod
      component: main